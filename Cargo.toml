[package]
name = "bnet-launcher"
version = "1.0.0"
edition = "2024"
description = "Add Battle.net games to Steam and launch them with in-game status, overlay and Steam Input"
license-file = "LICENSE"
publish = false

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
crc32fast = "1.5.6"
ctrlc = { version = "3.5.3", features = ["termination"] }
dirs = "7.0.0"
# glow (OpenGL) instead of the default wgpu: much smaller binary, and OpenGL is available
# everywhere this runs (Windows, SteamOS Desktop Mode).
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[target."cfg(windows)".dependencies]
mslnk = "0.1.8"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Console", "Win32_System_Threading", "Win32_System_SystemInformation"] }
winreg = "0.56.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target."cfg(unix)".dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
